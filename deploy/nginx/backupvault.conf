# BackupVault - Nginx Production Reverse Proxy Configuration
# Optimized for streaming uploads up to tens of GBs without RAM exhaustion

upstream backupvault_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name backup.domainanda.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backup.domainanda.com;

    # SSL Certificates (managed by Certbot or custom)
    ssl_certificate /etc/letsencrypt/live/backup.domainanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.domainanda.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Root directory for built React frontend
    root /var/www/cloudinmeet/frontend/dist;
    index index.html;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CRITICAL: Unlimited upload body size and disabled buffering for streaming uploads
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # Extended timeouts for large file transfers (up to 2 hours)
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_connect_timeout 300s;
    send_timeout 7200s;

    # Static frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and Upload proxy to Go backend
    location /api/ {
        proxy_pass http://backupvault_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering specifically for chunked streaming
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
